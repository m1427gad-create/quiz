<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة اليوم الوطني السعودي - العرض ثلاثي الأبعاد المحدث</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <!-- مكتبات Three.js للرسم وتفاعل الـ 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --sa-green: #006c35;
            --sa-bright-green: #00e676;
            --sa-gold: #d4af37;
            --bg-dark: #020804;
            --glass: rgba(0, 108, 53, 0.4);
            --glass-border: rgba(0, 230, 118, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; height: 100vh; overflow: hidden; display: flex; position: relative; }

        /* حاوية Three.js للـ 3D */
        #webgl-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        /* حاوية الأسئلة والنصوص في الجانب الأيمن */
        .content-container {
            position: absolute; right: 5%; top: 0; width: 45%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; pointer-events: none;
        }

        .slide { display: none; width: 100%; flex-direction: column; align-items: center; text-align: center; pointer-events: auto; }
        .slide.active { display: flex; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 { color: var(--sa-bright-green); font-size: 2.5rem; margin-bottom: 20px; text-shadow: 0 0 20px rgba(0,230,118,0.4); font-weight: 900; }
        p { font-size: 1.2rem; color: #e0e0e0; max-width: 500px; line-height: 1.6; }

        .quiz-box { 
            background: var(--glass); border: 2px solid var(--glass-border); 
            padding: 30px; border-radius: 20px; width: 100%; max-width: 550px; 
            backdrop-filter: blur(15px); box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }
        .q-header { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; color: var(--sa-bright-green); font-size: 1.1rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 12px; }
        
        .option { 
            padding: 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); 
            border-radius: 10px; margin-bottom: 12px; cursor: pointer; transition: 0.3s; text-align: right; font-size: 1.2rem; 
        }
        .option:hover { background: rgba(0,230,118,0.2); border-color: var(--sa-bright-green); transform: translateY(-2px); }
        .option.correct { background: #1b5e20 !important; border-color: #4caf50 !important; color: #fff; box-shadow: 0 0 15px #4caf50; }
        .option.wrong { background: #b71c1c !important; border-color: #ef5350 !important; color: #fff; box-shadow: 0 0 15px #ef5350; }

        .nav-btn { 
            background: linear-gradient(135deg, var(--sa-green), #004d24); border: 2px solid var(--sa-bright-green); 
            color: #fff; padding: 12px 35px; border-radius: 10px; cursor: pointer; 
            font-weight: bold; font-size: 1.1rem; margin-top: 20px; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .nav-btn:hover { background: var(--sa-bright-green); color: var(--bg-dark); transform: scale(1.05); }

        .progress-container { position: fixed; top: 0; width: 100%; height: 6px; background: rgba(255,255,255,0.1); z-index: 1000; }
        #progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--sa-green), var(--sa-bright-green)); transition: 0.4s; }

        .signature { position: fixed; bottom: 20px; right: 20px; padding: 8px 16px; background: var(--glass); border: 1px solid var(--sa-bright-green); border-radius: 8px; color: var(--sa-bright-green); font-weight: bold; font-size: 0.9rem; z-index: 100; pointer-events: auto; }
        .hint-3d { position: fixed; bottom: 20px; left: 20px; color: rgba(255,255,255,0.8); font-size: 0.9rem; z-index: 100; font-weight: bold; }
    </style>
</head>
<body>

<div id="webgl-container"></div>
<div class="progress-container"><div id="progress-bar"></div></div>

<div class="content-container">
    <!-- الشريحة 1: الترحيب -->
    <div class="slide active" id="slide-0">
        <div style="font-size: 5rem; margin-bottom: 15px;">🇸🇦</div>
        <h1>مسابقة اليوم الوطني السعودي</h1>
        <p>استمتع بالتحدي الوطني الكبير عبر 20 سؤالاً مميزاً مع خريطة المملكة ثلاثية الأبعاد التفاعلية في نطاق دوران متناسق وهادئ.</p>
        <button class="nav-btn" onclick="startQuiz()">ابدأ التحدي الذكي</button>
    </div>

    <!-- الشريحة 2: الأسئلة -->
    <div class="slide" id="slide-1">
        <div class="quiz-box">
            <div class="q-header">
                <span id="qNum">السؤال 1 من 20</span>
                <span id="qScore">النقاط: 0</span>
            </div>
            <p id="qText" style="font-size: 1.3rem; margin-bottom: 20px; text-align: right;"></p>
            <div id="qOptions"></div>
        </div>
    </div>

    <!-- الشريحة 3: النهاية -->
    <div class="slide" id="slide-2">
        <div style="font-size: 4rem; margin-bottom: 15px;">🏆</div>
        <h1>مملكة المجد والعز</h1>
        <p id="finalScoreText" style="font-size: 1.8rem; color: var(--sa-bright-green); margin: 15px 0; font-weight: bold;"></p>
        <button class="nav-btn" onclick="restartQuiz()">إعادة المسابقة</button>
    </div>
</div>

<div class="signature">✨ابتدائية عمير بن الحمام الانصاري   // أ. ماجد العوفي ✨</div>
<div class="hint-3d">💡 يمكنك سحب وتدوير الخريطة </div>

<script>
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(-2, 0, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 15;
    controls.minDistance = 5;

    const mapGroup = new THREE.Group();
    
    // إحداثيات الحدود الجغرافية الدقيقة لخريطة المملكة
    const saudiOutline = [
        [28.5, 34.8], [29.5, 35.0], [29.3, 36.5], [31.5, 37.0], [32.1, 39.0], 
        [31.0, 40.5], [30.0, 42.5], [29.1, 46.5], [28.3, 48.5], [27.0, 49.6], 
        [25.5, 50.8], [24.5, 51.5], [23.0, 53.0], [22.5, 55.0], [20.0, 55.5], 
        [19.0, 52.0], [17.5, 50.0], [16.5, 43.1], [17.5, 42.0], [19.5, 41.5], 
        [21.5, 39.1], [24.0, 37.5], [26.0, 36.5], [28.5, 34.8]
    ];

    function isInsideSaudi(lat, lng) {
        let inside = false;
        for (let i = 0, j = saudiOutline.length - 1; i < saudiOutline.length; j = i++) {
            let xi = saudiOutline[i][0], yi = saudiOutline[i][1];
            let xj = saudiOutline[j][0], yj = saudiOutline[j][1];
            let intersect = ((yi > lng) !== (yj > lng)) && (lat < (xj - xi) * (lng - yi) / (yj - yi) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    function createSaudiMap3D() {
        const totalGridPoints = 6000;
        const positions = [];
        const colors = [];

        const brightGreen = new THREE.Color('#00e676');
        const deepGreen = new THREE.Color('#006c35');

        for (let i = 0; i < totalGridPoints; i++) {
            let lat = 16.0 + Math.random() * 16.5;
            let lng = 34.5 + Math.random() * 21.5;

            if (isInsideSaudi(lat, lng)) {
                let x = (lng - 45) * 0.22;
                let y = (lat - 24) * 0.22;
                let z = (Math.random() - 0.5) * 0.3; // تجسيم محدد ومضغوط

                positions.push(x, y, z);
                let c = Math.random() > 0.3 ? brightGreen : deepGreen;
                colors.push(c.r, c.g, c.b);
            }
        }

        for (let i = 0; i < saudiOutline.length - 1; i++) {
            let p1 = saudiOutline[i];
            let p2 = saudiOutline[i + 1];
            for (let t = 0; t < 100; t++) {
                let ratio = t / 100;
                let lat = p1[0] + (p2[0] - p1[0]) * ratio;
                let lng = p1[1] + (p2[1] - p1[1]) * ratio;
                let x = (lng - 45) * 0.22;
                let y = (lat - 24) * 0.22;
                let z = (Math.random() - 0.5) * 0.08;

                positions.push(x, y, z);
                colors.push(brightGreen.r, brightGreen.g, brightGreen.b);
            }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.05,
            vertexColors: true,
            transparent: true,
            opacity: 0.95
        });

        const points = new THREE.Points(geometry, material);
        mapGroup.add(points);
        mapGroup.position.set(-2.5, 0, 0); // تثبيت الخريطة بالكامل في الجهة اليسرى
        scene.add(mapGroup);
    }
    createSaudiMap3D();

    // --- النقاط المتصاعدة الخارجية بتأثير أبطأ وأنعَم ---
    const bgSparksCount = 1000;
    const bgGeometry = new THREE.BufferGeometry();
    const bgPositions = new Float32Array(bgSparksCount * 3);
    const bgColors = new Float32Array(bgSparksCount * 3);
    const bgSpeeds = new Float32Array(bgSparksCount);

    const pureWhite = new THREE.Color('#ffffff');

    for (let i = 0; i < bgSparksCount; i++) {
        bgPositions[i * 3] = (Math.random() - 0.5) * 22;
        bgPositions[i * 3 + 1] = (Math.random() - 0.5) * 22;
        bgPositions[i * 3 + 2] = (Math.random() - 0.5) * 10;

        // سرعة بطيئة جداً وناعمة للشرارات البيضاء
        bgSpeeds[i] = Math.random() * 0.005 + 0.002;

        bgColors[i * 3] = pureWhite.r;
        bgColors[i * 3 + 1] = pureWhite.g;
        bgColors[i * 3 + 2] = pureWhite.b;
    }

    bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
    bgGeometry.setAttribute('color', new THREE.BufferAttribute(bgColors, 3));

    const bgMaterial = new THREE.PointsMaterial({
        size: 0.035,
        vertexColors: true,
        transparent: true,
        opacity: 0.65
    });

    const bgParticles = new THREE.Points(bgGeometry, bgMaterial);
    scene.add(bgParticles);

    // متغيرات لتضييق زاوية الدوران الذاتي
    let rotationTime = 0;

    function animate() {
        requestAnimationFrame(animate);

        // جعل دوران الخريطة يترجح في نطاق ضيق جداً بدلاً من الدوران المفتوح
        rotationTime += 0.008;
        mapGroup.rotation.y = Math.sin(rotationTime) * 0.25; // دوران ضيق ومحصور بـ 15 درجة فقط

        // صعود النقاط البيضاء ببطء
        const positions = bgGeometry.attributes.position.array;
        for (let i = 0; i < bgSparksCount; i++) {
            positions[i * 3 + 1] += bgSpeeds[i];
            if (positions[i * 3 + 1] > 11) {
                positions[i * 3 + 1] = -11;
            }
        }
        bgGeometry.attributes.position.needsUpdate = true;

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function playSound(type) {
        try {
            const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctxAudio.createOscillator();
            const gain = ctxAudio.createGain();
            osc.connect(gain);
            gain.connect(ctxAudio.destination);

            if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, ctxAudio.currentTime);
                osc.frequency.setValueAtTime(659.25, ctxAudio.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, ctxAudio.currentTime + 0.2);
                osc.frequency.setValueAtTime(1046.50, ctxAudio.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctxAudio.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctxAudio.currentTime + 0.6);
                osc.start();
                osc.stop(ctxAudio.currentTime + 0.6);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, ctxAudio.currentTime);
                osc.frequency.setValueAtTime(100, ctxAudio.currentTime + 0.25);
                gain.gain.setValueAtTime(0.4, ctxAudio.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctxAudio.currentTime + 0.5);
                osc.start();
                osc.stop(ctxAudio.currentTime + 0.5);
            }
        } catch(e) {}
    }

    // القائمة الكاملة بعد إضافة 5 أسئلة جديدة (20 سؤالاً)
    const quizData = [
        { q: "من هو مؤسس المملكة العربية السعودية الحديثة؟", a: ["الإمام محمد بن سعود", "الملك عبد العزيز آل سعود", "الملك سلمان بن عبد العزيز"], c: 1 },
        { q: "متى تم إعلان توحيد المملكة وتسميتها رسمياً؟", a: ["1351 هـ / 1932 م", "1139 هـ / 1727 م", "1400 هـ / 1980 م"], c: 0 },
        { q: "ما هو تاريخ يوم التأسيس السعودي الذي يخلد ذكرى تأسيس الدولة السعودية الأولى؟", a: ["23 سبتمبر", "22 فبراير", "1 يناير"], c: 1 },
        { q: "ما هي عاصمة المملكة العربية السعودية؟", a: ["مكة المكرمة", "المدينة المنورة", "الرياض"], c: 2 },
        { q: "كم عدد ملوك المملكة العربية السعودية (من المؤسس حتى خادم الحرمين الشريفين الملك سلمان)؟", a: ["5 ملوك", "7 ملوك", "9 ملوك"], c: 1 },
        { q: "ما لون سيفا الشعار السعودي (السيفين والنخلة)؟", a: ["الأبيض", "الأسود", "الذهبي"], c: 0 },
        { q: "ما الذي ترمز إليه النخلة في الشعار السعودي؟", a: ["النماء والخير والرخاء", "القوة والشدة", "التراث فقط"], c: 0 },
        { q: "أي من المناطق التالية تضم مشروع نيوم العملاق؟", a: ["منطقة الرياض", "منطقة مكة المكرمة", "منطقة تبوك"], c: 2 },
        { q: "ما هو المشروع السياحي العالمي الضخم على ساحل البحر الأحمر؟", a: ["مشروع البحر الأحمر (Red Sea Global)", "الدرعية", "العلا"], c: 0 },
        { q: "بماذا تُلقب المملكة رسمياً في سياق خدمتها للحرمين الشريفين؟", a: ["بلاد الحرمين الشريفين", "قلب العالم الإسلامي", "أرض السلام"], c: 0 },
        { q: "ما هي العملة الرسمية للمملكة العربية السعودية؟", a: ["الدينار", "الريال السعودي", "الدرهم"], c: 1 },
        { q: "في أي عام تم إطلاق رؤية السعودية 2030؟", a: ["2015 م", "2016 م", "2020 م"], c: 1 },
        { q: "ما هو أكبر حقل نفط ساحلي في العالم ويقع في المملكة؟", a: ["حقل الشيبة", "حقل الغوار", "حقل خريص"], c: 1 },
        { q: "ما هي أقدم مدينة تاريخية مسجلة في اليونسكو وتعتبر بوابة الآثار في العلا؟", a: ["مدائن صالح (الحجر)", "الدرعية التاريخية", "جدة التاريخية"], c: 0 },
        { q: "ما هو مطلع النشيد الوطني السعودي الرسمي؟", a: ["سارعي للمجد والعلياء", "بنينا مجدنا", "طويق العز"], c: 0 },
        // --- الأسئلة الـ 5 الجديدة ---
        { q: "ما هي القمة الجبلية الأعلى في المملكة العربية السعودية؟", a: ["جبل طويق", "جبل السودة", "جبل أحد"], c: 1 },
        { q: "ما هو اسم المعلم التاريخي في الرياض الذي كان بداية انطلاق استعادة الرياض على يد الملك عبدالعزيز؟", a: ["قصر المربع", "قصر المصمك", "قصر الحكم"], c: 1 },
        { q: "أي من هذه المدن السعودية تُلقب بـ عروس البحر الأحمر؟", a: ["جدة", "الدمام", "ينبع"], c: 0 },
        { q: "ما هو اسم المشروع التنموي الذي يستهدف غرس مليارات الأشجار وتخفيض الانبعاثات الكربونية؟", a: ["مبادرة السعودية الخضراء", "مشروع أمالا", "مشروع القدية"], c: 0 },
        { q: "ما هي العاصمة الأولى للدولة السعودية الأولى؟", a: ["الرياض", "الدرعية", "الرياض القديمة"], c: 1 }
    ];

    let currentQ = 0;
    let score = 0;

    function showSlide(index) {
        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
        document.getElementById(`slide-${index}`).classList.add('active');
    }

    function startQuiz() {
        currentQ = 0;
        score = 0;
        showSlide(1);
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById('progress-bar').style.width = `${(currentQ / quizData.length) * 100}%`;
        const data = quizData[currentQ];
        document.getElementById('qNum').innerText = `السؤال ${currentQ + 1} من ${quizData.length}`;
        document.getElementById('qScore').innerText = `النقاط: ${score}`;
        document.getElementById('qText').innerText = data.q;
        
        const optsContainer = document.getElementById('qOptions');
        optsContainer.innerHTML = '';

        data.a.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, btn, data.c);
            optsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIdx, btnElement, correctIdx) {
        const allOpts = document.querySelectorAll('.option');
        allOpts.forEach(o => o.style.pointerEvents = 'none');

        if (selectedIdx === correctIdx) {
            btnElement.classList.add('correct');
            score++;
            playSound('success');
            document.getElementById('qScore').innerText = `النقاط: ${score}`;
            
            setTimeout(() => {
                currentQ++;
                if (currentQ < quizData.length) {
                    loadQuestion();
                } else {
                    document.getElementById('progress-bar').style.width = '100%';
                    document.getElementById('finalScoreText').innerText = `نتيجة مذهلة: ${score} من ${quizData.length}`;
                    showSlide(2);
                }
            }, 700);

        } else {
            btnElement.classList.add('wrong');
            allOpts[correctIdx].classList.add('correct');
            playSound('error');
            
            setTimeout(() => {
                allOpts.forEach(o => {
                    o.style.pointerEvents = 'auto';
                    o.classList.remove('wrong', 'correct');
                });
            }, 1000);
        }
    }

    function restartQuiz() {
        startQuiz();
    }
</script>
</body>
</html>
